<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pip and the Dark</title>
<style>
  html,body{margin:0;height:100%;background:#15120e;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  #player{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;background:#000;user-select:none}
  #film{width:100%;height:100%;display:block}
  #bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:12px 16px;
       background:linear-gradient(transparent,rgba(10,8,6,.6));transition:opacity .35s}
  #player.idle #bar{opacity:0;pointer-events:none}
  #player.idle{cursor:none}
  .btn{width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,246,228,.16);cursor:pointer;display:grid;place-items:center;padding:0;flex:none}
  .btn:hover{background:rgba(255,246,228,.3)}
  .btn svg{width:18px;height:18px;fill:#fbf3e4}
  #scrub{flex:1;accent-color:#f1c15c;height:4px;cursor:pointer}
  #big{position:absolute;inset:0;margin:auto;width:92px;height:92px;border-radius:50%;border:0;background:rgba(30,22,14,.55);cursor:pointer;display:grid;place-items:center}
  #big svg{width:40px;height:40px;fill:#fbf3e4;margin-left:6px}
  #player.started #big{display:none}
  .render #bar,.render #big{display:none!important}
</style>
</head>
<body>
<div id="player" aria-label="Animated short film player">
  <canvas id="film" width="1280" height="720"></canvas>
  <button id="big" aria-label="Play film"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></button>
  <div id="bar">
    <button class="btn" id="pp" aria-label="Play or pause"><svg viewBox="0 0 24 24" id="ppi"><path d="M7 4l13 8-13 8z"/></svg></button>
    <button class="btn" id="rs" aria-label="Restart"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
    <input id="scrub" type="range" min="0" max="60" step="0.01" value="0" aria-label="Seek">
    <button class="btn" id="fs" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M3 3h7v2H5v5H3zm11 0h7v7h-2V5h-5zM3 14h2v5h5v2H3zm16 0h2v7h-7v-2h5z"/></svg></button>
  </div>
</div>
<script>
'use strict';
/* =====================================================================
   PIP AND THE DARK  -  a wordless procedural short.
   Every frame is render(t): a pure function of time. Every sound is
   scheduled from one event list against the audio clock.
   Sections: 1 core math  2 textures  3 ink & wash  4 characters
             5 set pieces  6 shots  7 renderer  8 audio  9 player/API
   ===================================================================== */

/* ---------- 1. CORE ---------- */
const W = 1280, H = 720, DUR = 60, BPM = 100, BEAT = 60 / BPM, FPS = 30;
const B = b => b * BEAT;                         // beats -> seconds
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, u) => a + (b - a) * u;
const sstep = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const eio = u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
const eout = u => 1 - Math.pow(1 - clamp(u), 3);
const eback = u => { u = clamp(u); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); };
const TAU = Math.PI * 2;

function hash(a, b = 0, c = 0) {
  let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 1440662683);

  return (h >>> 0) / 4294967296;
}
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function vn1(x, s) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i, s, 7), hash(i + 1, s, 7), u); }
function vn2(x, y, s) { const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j, ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  return lerp(lerp(hash(i, j, s), hash(i + 1, j, s), ux), lerp(hash(i, j + 1, s), hash(i + 1, j + 1, s), ux), uy); }
function fbm2(x, y, s, o = 4) { let a = 0, amp = .5, f = 1, n = 0; for (let i = 0; i < o; i++) { a += amp * vn2(x * f, y * f, s + i * 17); n += amp; amp *= .5; f *= 2; } return a / n; }
// keyframes [[t,v],...] with smooth easing between keys
function kf(t, K) { if (t <= K[0][0]) return K[0][1]; for (let i = 0; i < K.length - 1; i++) { const a = K[i], b = K[i + 1]; if (t < b[0]) { let u = (t - a[0]) / (b[0] - a[0]); u = u * u * (3 - 2 * u); return a[1] + (b[1] - a[1]) * u; } } return K[K.length - 1][1]; }
function pulse(t, t0, amp, dec = 6, fr = 18) { if (t < t0) return 0; const d = t - t0; return amp * Math.exp(-d * dec) * Math.cos(d * fr); }
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

/* ---------- STORY TIMELINE (beats) - shared by picture and score ---------- */
const TB = B(20), TR = B(88);                       // blackout begins / power returns
const COURAGE = [[0, .5], [24, .05], [38, .06], [38.6, .35], [48, .36], [50, .37], [50.3, .12], [52, .25], [54, .45], [56, .5], [60, .5], [60.3, 1], [64, .85], [72, .85], [74.5, .95], [80, 1], [100, 1]];
const courage = t => kf(t / BEAT, COURAGE);
// Pip's LED: nervous flicker shrinks as courage grows (shared with audio ticks)
function ledDrop(t) { const c = courage(t), step = Math.floor(t * 14); return hash(step, 5, 55) < (1 - c) * .55 ? .15 + hash(step, 6, 55) * .4 : 1; }
function pipLed(t) { if (t < TB) return .55; const c = courage(t); return (.18 + .82 * c) * ledDrop(t) * (1 - (1 - c) * .25 * vn1(t * 9, 3)); }
function lampPow(t, k) {
  k = Math.max(0, k);
  if (t < TB) return 1;
  if (t < TR) { const off = B(22) + .16 * k; if (t > off) return 0; const f = hash(Math.floor(t * 15), k, 31); return f < .3 ? .2 : (t > B(21) ? .6 : 1); }
  const on = TR + .12 * k; if (t < on) return 0; if (t < on + .5) return hash(Math.floor(t * 18), k, 32) < .6 ? 1 : .25; return 1;
}
const powerAt = t => lampPow(t, 0);
const isDark = t => t >= B(22) && t < TR + 1.6;
function ramped(t, v, t1, tau1, t2, tau2) { // integral of a speed that decays at t1 and recovers at t2
  if (t < t1) return v * t;
  const base = v * t1 + v * tau1 * (1 - Math.exp(-(Math.min(t, t2) - t1) / tau1));
  if (t < t2) return base; const u = t - t2; return base + v * (u - tau2 * (1 - Math.exp(-u / tau2)));
}
const beltPos = t => ramped(t, 60, B(22), .5, TR, 1);
const mechTime = t => ramped(t, 1, B(22), .4, TR, .8);
const blink = (t, per = 1.2, ph = 0) => { const p = ((t + ph) / per) % 1; return sstep(0, .06, p) * (1 - sstep(.28, .55, p)); };

/* ---------- 2. PROCEDURAL TEXTURES (built once, seeded) ---------- */
let PAPER, PAPERV, GRAIN = [], GRAINP = [], BLOBS = [], PAT = {};
const P = { wall: '#dcc9a3', pillar: '#b39c76', truss: '#8f7f64', pipe1: '#8aa0a3', pipe2: '#c27348', win: '#34405e', floor: '#b8a17d',
  belt: '#48443e', frame: '#8c979c', cream: '#eadcbd', teal: '#5c9a96', orange: '#d98549', glass: '#3f5557', shade: '#3e6b59',
  pcbG: '#2f7a4c', pcbB: '#2e5d9c', gold: '#d9ad4a', metal: '#a7afb3' };
const INK = '#2a1f17';

function makePaper() {
  const c = mk(W, H), g = c.getContext('2d'), r = mulberry32(11);
  g.fillStyle = '#f4ecdb'; g.fillRect(0, 0, W, H);
  const s = mk(160, 90), sg = s.getContext('2d'), id = sg.createImageData(160, 90);
  for (let y = 0; y < 90; y++) for (let x = 0; x < 160; x++) { const n = fbm2(x / 30, y / 30, 5, 4), v = 236 + (n - .5) * 46, i = (y * 160 + x) * 4;
    id.data[i] = v; id.data[i + 1] = v - 5; id.data[i + 2] = v - 14; id.data[i + 3] = 255; }
  sg.putImageData(id, 0, 0); g.globalCompositeOperation = 'multiply'; g.imageSmoothingEnabled = true; g.drawImage(s, 0, 0, W, H);
  g.globalCompositeOperation = 'source-over'; g.lineCap = 'round';
  for (let i = 0; i < 2600; i++) { const x = r() * W, y = r() * H, a = r() * TAU, l = 3 + r() * 14;
    g.strokeStyle = r() < .5 ? 'rgba(110,90,60,.07)' : 'rgba(255,255,250,.16)'; g.lineWidth = .6 + r();
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * l * .5 + r() * 3, y + Math.sin(a) * l * .5, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  for (let i = 0; i < 4000; i++) { g.fillStyle = r() < .6 ? 'rgba(90,70,40,.08)' : 'rgba(255,255,255,.2)'; g.fillRect(r() * W, r() * H, 1 + r(), 1 + r()); }
  return c;
}
function makeGrain(seed) {
  const c = mk(256, 256), g = c.getContext('2d'), id = g.createImageData(256, 256), r = mulberry32(seed);
  for (let i = 0; i < 256 * 256; i++) { const v = 128 + (r() + r() - 1) * 90; id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 255; }
  g.putImageData(id, 0, 0); return c;
}
function makeBlob(seed) {
  const S = 256, c = mk(S, S), g = c.getContext('2d'), id = g.createImageData(S, S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const dx = x - 128, dy = y - 128, th = Math.atan2(dy, dx), R = 112 * (.72 + .28 * fbm2(Math.cos(th) * 1.6 + 5, Math.sin(th) * 1.6 + 5, seed, 3));
    const d = Math.hypot(dx, dy) / R; let a = 0;
    if (d < 1) { a = .45 + .4 * fbm2(x / 40, y / 40, seed + 9, 4); a += .45 * Math.exp(-Math.pow((d - .9) / .06, 2)); a *= 1 - sstep(.95, 1, d); }
    const i = (y * S + x) * 4; id.data[i] = id.data[i + 1] = id.data[i + 2] = 255; id.data[i + 3] = clamp(a) * 255;
  }
  g.putImageData(id, 0, 0); return c;
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const f = v => clamp(Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt), 0, 255);
  return '#' + ((1 << 24) | (f(r) << 16) | (f(g) << 8) | f(b)).toString(16).slice(1);
}
function makePCB(base, seed) {
  const S = 256, c = mk(S, S), g = c.getContext('2d'), r = mulberry32(seed);
  g.fillStyle = base; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 2500; i++) { g.fillStyle = r() < .5 ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.06)'; g.fillRect(r() * S, r() * S, 2, 2); }
  const cu = shade(base, .22), paths = [];
  for (let n = 0; n < 24; n++) { let x = Math.round(r() * 32) * 8, y = Math.round(r() * 32) * 8; const pts = [x, y]; let dir = Math.floor(r() * 4) * 2;
    for (let s = 0; s < 5; s++) { const L = (2 + Math.floor(r() * 5)) * 8; x += Math.round(Math.cos(dir * Math.PI / 4)) * L; y += Math.round(Math.sin(dir * Math.PI / 4)) * L; pts.push(x, y); dir = (dir + (r() < .5 ? 1 : 7)) % 8; }
    paths.push(pts); }
  for (const ox of [-S, 0, S]) for (const oy of [-S, 0, S]) {
    g.strokeStyle = cu; g.lineWidth = 2.6; g.lineJoin = 'round';
    for (const p of paths) { g.beginPath(); g.moveTo(p[0] + ox, p[1] + oy); for (let i = 2; i < p.length; i += 2) g.lineTo(p[i] + ox, p[i + 1] + oy); g.stroke();
      const ex = p[p.length - 2] + ox, ey = p[p.length - 1] + oy; g.fillStyle = P.gold; g.beginPath(); g.arc(ex, ey, 3.4, 0, TAU); g.fill(); g.fillStyle = '#1b1a16'; g.beginPath(); g.arc(ex, ey, 1.3, 0, TAU); g.fill(); }
  }
  for (let i = 0; i < 9; i++) { const x = r() * 220, y = r() * 220, w = 12 + r() * 26, h = 8 + r() * 14;
    g.strokeStyle = 'rgba(240,238,225,.75)'; g.lineWidth = 1.2; g.strokeRect(x, y, w, h);
    g.fillStyle = P.gold; for (let k = 0; k < 4; k++) { g.fillRect(x + 2 + k * (w - 6) / 3, y - 3, 3, 3); g.fillRect(x + 2 + k * (w - 6) / 3, y + h, 3, 3); } }
  return c;
}
function makeMetal(seed) {
  const S = 256, c = mk(S, S), g = c.getContext('2d'), r = mulberry32(seed);
  g.fillStyle = '#b3b9bc'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 700; i++) { const y = r() * S; g.strokeStyle = r() < .5 ? 'rgba(255,255,255,.18)' : 'rgba(40,50,60,.12)'; g.lineWidth = r() * 1.4; g.beginPath(); g.moveTo(0, y); g.lineTo(S, y + (r() - .5) * 2); g.stroke(); }
  return c;
}
function makeHatch(col, sp, cross, lw) {
  const S = 64, c = mk(S, S), g = c.getContext('2d'); g.strokeStyle = col; g.lineWidth = lw; g.lineCap = 'round';
  for (let i = -S; i <= S * 2; i += sp) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + S, S); g.stroke(); if (cross) { g.beginPath(); g.moveTo(i + S, 0); g.lineTo(i, S); g.stroke(); } }
  return c;
}
function makeTextures(ctx) {
  PAPER = makePaper();
  PAPERV = mk(W, H); { const g = PAPERV.getContext('2d'); g.drawImage(PAPER, 0, 0); g.globalCompositeOperation = 'multiply';
    const gr = g.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95); gr.addColorStop(0, '#fff'); gr.addColorStop(1, '#b49a7c'); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
  for (let i = 0; i < 4; i++) { GRAIN.push(makeGrain(100 + i)); GRAINP.push(ctx.createPattern(GRAIN[i], 'repeat')); }
  for (let i = 0; i < 6; i++) BLOBS.push(makeBlob(300 + i * 13));
  const pat = (cv, s) => { const p = ctx.createPattern(cv, 'repeat'); p.setTransform(new DOMMatrix().scale(s)); return p; };
  PAT.pcbG = pat(makePCB(P.pcbG, 21), .38); PAT.pcbB = pat(makePCB(P.pcbB, 22), .38); PAT.pcbR = pat(makePCB('#8e3b33', 23), .3);
  PAT.pcbWall = pat(makePCB('#2c5a47', 24), .9);
  PAT.metal = pat(makeMetal(31), 1); PAT.hatchN = pat(makeHatch('rgba(135,155,215,.5)', 8, true, 1), 1);
  PAT.hatchI = pat(makeHatch('rgba(42,31,23,.55)', 7, false, 1.1), 1); PAT.hatchX = pat(makeHatch('rgba(42,31,23,.5)', 7, true, 1), 1);
}
const TINT = new Map();
function tinted(i, col) { const k = i + col; let c = TINT.get(k); if (!c) { c = mk(256, 256); const g = c.getContext('2d'); g.drawImage(BLOBS[i], 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = col; g.fillRect(0, 0, 256, 256); TINT.set(k, c); } return c; }
const rgbHex = c => '#' + ((1 << 24) | (c[0] << 16) | (c[1] << 8) | c[2]).toString(16).slice(1);

/* ---------- 3. INK & WATERCOLOUR ---------- */
let T = 0, BOIL = 0;                       // current time; boil frame (ink re-drawn 10x/s)
function smoothPath(ctx, p, close) {
  const n = p.length >> 1; if (n < 2) return;
  if (n < 3) { ctx.moveTo(p[0], p[1]); ctx.lineTo(p[2], p[3]); if (close) ctx.closePath(); return; }
  if (close) { ctx.moveTo((p[2 * n - 2] + p[0]) / 2, (p[2 * n - 1] + p[1]) / 2);
    for (let i = 0; i < n; i++) { const j = (i + 1) % n; ctx.quadraticCurveTo(p[2 * i], p[2 * i + 1], (p[2 * i] + p[2 * j]) / 2, (p[2 * i + 1] + p[2 * j + 1]) / 2); } ctx.closePath(); }
  else { ctx.moveTo(p[0], p[1]); for (let i = 1; i < n - 1; i++) ctx.quadraticCurveTo(p[2 * i], p[2 * i + 1], (p[2 * i] + p[2 * i + 2]) / 2, (p[2 * i + 1] + p[2 * i + 3]) / 2); ctx.lineTo(p[2 * n - 2], p[2 * n - 1]); }
}
function jitPts(p, id, amp) { const o = new Array(p.length); for (let i = 0; i < p.length; i++) o[i] = p[i] + (hash(id, i, BOIL) - .5) * 2 * amp; return o; }
function ink(ctx, pts, o = {}) {
  const w = o.w ?? 2, amp = o.amp ?? 1.1, id = o.id ?? 1, a = o.a ?? 1;
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = o.col || INK;
  ctx.globalAlpha = a * .9; ctx.lineWidth = w; ctx.beginPath(); smoothPath(ctx, jitPts(pts, id, amp), o.close); ctx.stroke();
  if (o.pass2 !== false) { ctx.globalAlpha = a * .4; ctx.lineWidth = w * .55; ctx.beginPath(); smoothPath(ctx, jitPts(pts, id + 7919, amp * 1.7), o.close); ctx.stroke(); }
  ctx.restore();
}
function rrect(x, y, w, h, r, st = 20) {
  const p = [], seg = (x0, y0, x1, y1) => { const n = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0) / st)); for (let i = 0; i < n; i++) p.push(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n); };
  const arc = (cx, cy, a0) => { for (let i = 0; i <= 3; i++) { const a = a0 + i / 3 * Math.PI / 2; p.push(cx + Math.cos(a) * r, cy + Math.sin(a) * r); } };
  seg(x + r, y, x + w - r, y); arc(x + w - r, y + r, -Math.PI / 2); seg(x + w, y + r, x + w, y + h - r); arc(x + w - r, y + h - r, 0);
  seg(x + w - r, y + h, x + r, y + h); arc(x + r, y + h - r, Math.PI / 2); seg(x, y + h - r, x, y + r); arc(x + r, y + r, Math.PI); return p;
}
const rect = (x, y, w, h, st) => rrect(x, y, w, h, 1.5, st);
function el(cx, cy, rx, ry, n = 20) { const p = []; for (let i = 0; i < n; i++) { const a = i / n * TAU; p.push(cx + Math.cos(a) * rx, cy + Math.sin(a) * ry); } return p; }
function line(x0, y0, x1, y1, n = 4) { const p = []; for (let i = 0; i <= n; i++) p.push(lerp(x0, x1, i / n), lerp(y0, y1, i / n)); return p; }
function poly(ctx, pts, close = true) { ctx.beginPath(); smoothPath(ctx, pts, close); }
function fillWC(ctx, pts, col, o = {}) {        // flat pigment + pooled darker edge
  ctx.save(); ctx.globalAlpha = o.a ?? 1; ctx.fillStyle = col; poly(ctx, pts); ctx.fill();
  ctx.globalAlpha = (o.a ?? 1) * .3; ctx.strokeStyle = shade(col.startsWith('#') ? col : '#777777', -.3); ctx.lineWidth = o.ew ?? 3.5; ctx.stroke(); ctx.restore();
}
function fillPat(ctx, pts, pat, a = 1) { ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = pat; poly(ctx, pts); ctx.fill(); ctx.restore(); }
function hatchIn(ctx, pts, pat = PAT.hatchI, a = .6) { ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = pat; poly(ctx, pts); ctx.fill(); ctx.restore(); }
function wash(ctx, x, y, rx, ry, col, seed, a = .5, op = 'multiply') {
  const i = Math.floor(hash(seed, 3, 3) * BLOBS.length); ctx.save(); ctx.globalCompositeOperation = op; ctx.globalAlpha = a;
  ctx.translate(x, y); ctx.rotate(hash(seed, 5, 5) * TAU); ctx.drawImage(tinted(i, col), -rx, -ry, rx * 2, ry * 2); ctx.restore();
}
function glowDot(ctx, x, y, r, c, a) { if (a <= .005) return; const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(${c},${a})`); g.addColorStop(.3, `rgba(${c},${a * .45})`); g.addColorStop(1, `rgba(${c},0)`);
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); ctx.restore(); }

/* ---------- 4. CHARACTERS ---------- */
const GROUND = 500;
